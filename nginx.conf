server {
    listen $PORT;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Domínio antigo do Railway (*.up.railway.app) → domínio oficial, mantendo caminho e query (SPEC-20261023-1207).
    # O Cloudflare entrega pokerdagalera.com.br com o Host original; o healthcheck do Railway usa outro host.
    if ($host ~* \.up\.railway\.app$) {
        return 301 https://pokerdagalera.com.br$request_uri;
    }

    # Bundle do Vite (/assets/*): nome de arquivo com hash do conteúdo → imutável por 1 ano.
    # `^~` garante que esta location vence as regex abaixo.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html: sempre revalidar. É ele que aponta para os assets com hash e para os ícones
    # versionados (?v=), então nunca pode ficar preso no cache (browser ou borda do Cloudflare).
    location = /index.html {
        etag on;
        add_header Cache-Control "no-cache";
    }

    # /tv: o mesmo app com o cartão OG do telão (prévia de pktv.com.br/pkdg.com.br) — SPEC-20261023-1207.
    # Mesma regra de cache do index.html.
    location = /tv {
        try_files /tv.html /index.html;
        etag on;
        add_header Cache-Control "no-cache";
    }

    # Termos e privacidade em HTML estático (legíveis sem JavaScript, ex.: robô da verificação de marca do Google);
    # gerados de src/pages/legal/legal.content.ts por scripts/legal/build-legal-pages.mjs — SPEC-20261023-1207.
    location = /termos {
        try_files /termos.html /index.html;
        etag on;
        add_header Cache-Control "no-cache";
    }

    location = /privacidade {
        try_files /privacidade.html /index.html;
        etag on;
        add_header Cache-Control "no-cache";
    }

    # Manifest PWA: tipo MIME próprio + mesmo cache curto dos demais estáticos.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        etag on;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Demais estáticos sem hash no nome (favicon.ico/.svg, apple-touch-icon, icon-*.png, brand/*.png,
    # og-image*.png, fontes fora de /assets/): 1 h de cache e revalidação por etag. Trocar a arte
    # propaga em até 1 h; as referências com ?v= (index.html/tv.html/manifest) furam o cache na hora.
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf)$ {
        etag on;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
